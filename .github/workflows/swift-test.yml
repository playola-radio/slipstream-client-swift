name: swift test

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_call: # release.yml tests the exact commit it is about to publish
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: swift --version
      - run: swift test
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: >
          xcodebuild test
          -project SlipstreamViewer.xcodeproj
          -scheme SlipstreamViewer
          -destination 'platform=macOS'
          -skipPackagePluginValidation

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true # the bump test runs fastlane
      - run: |
          for test in packaging/test/*_test.rb; do
            ruby "$test"
          done
      - run: |
          for script in packaging/*.sh; do
            bash -n "$script"
          done
      - name: Release notes in changelog.d/ are well formed
        run: ruby packaging/release_notes.rb notes CHANGELOG.md changelog.d
      - name: Checked-in version has release notes
        run: |
          version="$(sed -n 's/.*MARKETING_VERSION: "\([0-9][0-9.]*\)".*/\1/p' project.yml)"
          ruby packaging/release_notes.rb extract CHANGELOG.md "$version" /tmp/release-notes.md
